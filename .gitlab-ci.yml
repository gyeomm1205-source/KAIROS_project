stages:
  - build
  - gitops

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "build-test" || $CI_COMMIT_BRANCH == "master"'
    - when: never

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

.docker-build-template:
  stage: build
  image: docker:27.1.2
  services:
    - name: docker:27.1.2-dind
  before_script:
    - test -n "$DOCKERHUB_USERNAME"
    - test -n "$DOCKERHUB_TOKEN"
    - test -n "$DOCKERHUB_NAMESPACE"
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

.docker-java-build-template:
  stage: build
  image: docker:27.1.2
  services:
    - name: docker:27.1.2-dind
  before_script:
    - apk add --no-cache openjdk21-jdk
    - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk
    - export PATH="$JAVA_HOME/bin:$PATH"
    - test -n "$DOCKERHUB_USERNAME"
    - test -n "$DOCKERHUB_TOKEN"
    - test -n "$DOCKERHUB_NAMESPACE"
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

build_vue_fe:
  extends: .docker-build-template
  script:
    - : "${BASE_DOMAIN:=127.0.0.1.nip.io}"
    - docker build --pull -t "docker.io/${DOCKERHUB_NAMESPACE}/vue-fe:${IMAGE_TAG}" --build-arg VITE_SPRING_BASE_URL="http://spring.${BASE_DOMAIN}" --build-arg VITE_FASTAPI_BASE_URL="http://fastapi.${BASE_DOMAIN}" -f vue-fe/Dockerfile vue-fe
    - docker push "docker.io/${DOCKERHUB_NAMESPACE}/vue-fe:${IMAGE_TAG}"

build_springboot_be:
  extends: .docker-java-build-template
  script:
    - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk
    - export PATH="$JAVA_HOME/bin:$PATH"
    - chmod +x springboot-be/gradlew
    - ./springboot-be/gradlew -p springboot-be --no-daemon bootBuildImage --imageName="docker.io/${DOCKERHUB_NAMESPACE}/springboot-be:${IMAGE_TAG}"
    - docker push "docker.io/${DOCKERHUB_NAMESPACE}/springboot-be:${IMAGE_TAG}"

build_fastapi_be:
  extends: .docker-build-template
  script:
    - docker build --pull -t "docker.io/${DOCKERHUB_NAMESPACE}/fastapi-be:${IMAGE_TAG}" -f fastapi-be/Dockerfile fastapi-be
    - docker push "docker.io/${DOCKERHUB_NAMESPACE}/fastapi-be:${IMAGE_TAG}"

update_gitops_manifest:
  stage: gitops
  image: alpine:3.20
  needs:
    - job: build_vue_fe
    - job: build_springboot_be
    - job: build_fastapi_be
  before_script:
    - apk add --no-cache git sed
  script:
    - test -n "$DOCKERHUB_NAMESPACE"
    - : "${BASE_DOMAIN:=127.0.0.1.nip.io}"
    - VALUES_FILE="infra/helm/s14-app/values.yaml"
    - sed -i "s|^baseDomain: .*|baseDomain: ${BASE_DOMAIN}|g" "$VALUES_FILE"
    - sed -i "s|repository: docker.io/.*/vue-fe|repository: docker.io/${DOCKERHUB_NAMESPACE}/vue-fe|g" "$VALUES_FILE"
    - sed -i "s|repository: docker.io/.*/springboot-be|repository: docker.io/${DOCKERHUB_NAMESPACE}/springboot-be|g" "$VALUES_FILE"
    - sed -i "s|repository: docker.io/.*/fastapi-be|repository: docker.io/${DOCKERHUB_NAMESPACE}/fastapi-be|g" "$VALUES_FILE"
    - sed -i "/vueFe:/,/springbootBe:/ s|tag: .*|tag: ${IMAGE_TAG}|g" "$VALUES_FILE"
    - sed -i "/springbootBe:/,/fastapiBe:/ s|tag: .*|tag: ${IMAGE_TAG}|g" "$VALUES_FILE"
    - sed -i "/fastapiBe:/,\$ s|tag: .*|tag: ${IMAGE_TAG}|g" "$VALUES_FILE"
    - |
      if git diff --quiet -- "$VALUES_FILE"; then
        echo "No GitOps changes detected."
        exit 0
      fi
    - git config user.name "gitlab-ci"
    - git config user.email "gitlab-ci@local"
    - PUSH_USER="${GIT_PUSH_USERNAME:-gitlab-ci-token}"
    - PUSH_TOKEN="${GIT_PUSH_TOKEN:-$CI_JOB_TOKEN}"
    - git remote set-url origin "https://${PUSH_USER}:${PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git add "$VALUES_FILE"
    - git commit -m "chore(helm): update image tags to ${IMAGE_TAG} [skip ci]"
    - git push origin "HEAD:${CI_COMMIT_BRANCH}"
