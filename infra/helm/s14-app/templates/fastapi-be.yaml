apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-be
  labels:
    app.kubernetes.io/name: fastapi-be
spec:
  replicas: {{ .Values.replicaCount.fastapiBe }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fastapi-be
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fastapi-be
    spec:
      containers:
        - name: fastapi-be
          image: "{{ .Values.images.fastapiBe.repository }}:{{ .Values.images.fastapiBe.tag }}"
          imagePullPolicy: {{ .Values.images.fastapiBe.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SPRING_BASE_URL
              value: "http://springboot-be.{{ .Release.Namespace }}.svc.cluster.local:8080"
          readinessProbe:
            httpGet:
              path: /api/test/ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/test/ping
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-be
  labels:
    app.kubernetes.io/name: fastapi-be
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fastapi-be
  ports:
    - name: http
      port: 8000
      targetPort: http
