apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-be
  labels:
    app.kubernetes.io/name: springboot-be
spec:
  replicas: {{ .Values.replicaCount.springbootBe }}
  selector:
    matchLabels:
      app.kubernetes.io/name: springboot-be
  template:
    metadata:
      labels:
        app.kubernetes.io/name: springboot-be
    spec:
{{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
{{- end }}
      containers:
        - name: springboot-be
          image: "{{ .Values.images.springbootBe.repository }}:{{ .Values.images.springbootBe.tag }}"
          imagePullPolicy: {{ .Values.images.springbootBe.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_FASTAPI_BASE_URL
              value: "http://fastapi-be.{{ .Release.Namespace }}.svc.cluster.local:8000"
            - name: APP_CORS_ALLOWED_ORIGIN_PATTERNS
              value: "*"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: springboot-be
  labels:
    app.kubernetes.io/name: springboot-be
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: springboot-be
  ports:
    - name: http
      port: 8080
      targetPort: http
