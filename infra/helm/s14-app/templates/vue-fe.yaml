apiVersion: apps/v1
kind: Deployment
metadata:
  name: vue-fe
  labels:
    app.kubernetes.io/name: vue-fe
spec:
  replicas: {{ .Values.replicaCount.vueFe }}
  selector:
    matchLabels:
      app.kubernetes.io/name: vue-fe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vue-fe
    spec:
      containers:
        - name: vue-fe
          image: "{{ .Values.images.vueFe.repository }}:{{ .Values.images.vueFe.tag }}"
          imagePullPolicy: {{ .Values.images.vueFe.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: vue-fe
  labels:
    app.kubernetes.io/name: vue-fe
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vue-fe
  ports:
    - name: http
      port: 80
      targetPort: http
