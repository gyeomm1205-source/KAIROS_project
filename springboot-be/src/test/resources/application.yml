spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
  jwt:
    secret: test-jwt-secret-key-test-jwt-secret-key-test-jwt-secret-key

service:
  access-token-duration: 3600000
  refresh-token-duration: 604800000

oauth:
  content-type: application/x-www-form-urlencoded
  grant_type: authorization_code
  google:
    client_id: test-google-client-id
    client_secret: test-google-client-secret
    auth_uri: https://example.com/google/auth
    redirect_uri: https://example.com/google/redirect
    token-url: https://example.com/google/token
    scope: email profile
    user-info-url: https://example.com/google/userinfo
    calendar_api: https://example.com/google/calendar
  github:
    accept-vnd: application/vnd.github+json
    api-version: 2026-03-10
    client_id: test-github-client-id
    client_secret: test-github-client-secret
    auth_uri: https://example.com/github/auth
    redirect_uri: https://example.com/github/redirect
    token-url: https://example.com/github/token
    scope: user:email
    user-agent: test-agent
    user-info-url: https://example.com/github/userinfo

ai:
  server-url: https://example.com
  collect-async-path: /ai/collect

app:
  crypto:
    password: test-password
    salt: deadbeefdeadbeef

management:
  health:
    redis:
      enabled: false
