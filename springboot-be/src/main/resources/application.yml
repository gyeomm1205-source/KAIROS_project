spring:
  application:
    name: springboot-be
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 6000
  jwt:
    secret: ${JWT_SECRET_KEY}
server:
  servlet:
    context-path: /api/v1
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,prometheus
  endpoint:
    health:
      show-details: always
service:
  access-token-duration: ${ACCESS_TOKEN_DURATION} # 8시간
  refresh-token-duration: ${REFRESH_TOKEN_DURATION} # 128시간 -> 1주일
oauth:
  content-type: application/x-www-form-urlencoded
  grant_type: authorization_code
  google:
    client_id: ${GOOGLE_CLIENT_ID}
    client_secret: ${GOOGLE_CLIENT_SECRET}
    auth_uri: ${GOOGLE_AUTH_URL}
    redirect_uri: ${GOOGLE_REDIRECT_URL}
    token-url: ${GOOGLE_TOKEN_URL}
    scope: ${GOOGLE_CLIENT_SCOPE}
    user-info-url: ${GOOGLE_USER_INFO_URL}
    calendar_api: ${GOOGLE_CALENDAR_API}
  github:
    accept-vnd: application/vnd.github+json
    api-version: 2026-03-10
    client_id: ${GITHUB_CLIENT_ID}
    client_secret: ${GITHUB_CLIENT_SECRET}
    auth_uri: ${GITHUB_AUTH_URL}
    redirect_uri: ${GITHUB_REDIRECT_URL}
    csrf_code: ${GITHUB_CSRF_CODE}
    token-url: ${GITHUB_TOKEN_URL}
    scope: ${GITHUB_CLIENT_SCOPE}
